<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trend Shop | Ropa que enamora</title>
    <meta name="description" content="Catálogo online de ropa como nueva, accesorios y calzado. ¡Estilo increíble a precios de oportunidad!">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDKs (Compat version) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
        
        body { font-family: 'Outfit', sans-serif; background: #fdfcf0; color: #1E3A5F; overflow-x: hidden; margin: 0; }
        .bg-vibrant { background: linear-gradient(135deg, #FF0080 0%, #7928CA 100%); }
        .product-card { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); border-radius: 2rem; overflow: hidden; background: white; }
        .product-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .magenta-glow { box-shadow: 0 0 15px rgba(233, 30, 99, 0.3); }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); }
        @keyframes bounce-soft { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .animate-bounce-soft { animation: bounce-soft 3s infinite; }
        .color-azul { color: #1E3A5F; }
        .color-magenta { color: #E91E63; }
        .bg-magenta { background-color: #E91E63; }
        
        /* Estilo para el estado de carga */
        #loader {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: #fdfcf0;
        }
    </style>
</head>
<body>
    <div id="root">
        <div id="loader">
            <i class="fas fa-spinner fa-spin" style="font-size: 3rem; color: #D4AF37;"></i>
            <p style="margin-top: 1rem; font-weight: bold; color: #1E3A5F;">Abriendo Trend Shop...</p>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- INICIALIZACIÓN SEGURA ---
        let db, auth;
        const appId = window.__app_id || 'trend-shop-cdmx';
        
        try {
            const firebaseConfig = JSON.parse(window.__firebase_config || '{}');
            if (!firebase.apps.length && firebaseConfig.apiKey) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.firestore();
            auth = firebase.auth();
        } catch (e) {
            console.error("Error inicializando servicios:", e);
        }

        const CATEGORIES = ["Ropa", "Calzado", "Accesorios"];
        const GENDERS = ["Mujer", "Hombre", "Unisex", "Infantil"];
        const SIZES = ["XS", "S", "M", "L", "XL", "Única", "24", "25", "26", "27", "28", "29", "30", "31", "32"];

        function App() {
            const [user, setUser] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [products, setProducts] = useState([]);
            const [loading, setLoading] = useState(true);
            const [showAdd, setShowAdd] = useState(false);
            const [showLogin, setShowLogin] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [pass, setPass] = useState("");
            const [search, setSearch] = useState("");
            const [logo, setLogo] = useState(""); // Empezamos vacío para usar fallback
            
            const [imgbbKey, setImgbbKey] = useState(localStorage.getItem('imgbb_key') || "");
            const [uploading, setUploading] = useState(false);
            
            const [newP, setNewP] = useState({ name: "", price: "", category: "Ropa", gender: "Mujer", size: "M", description: "", imageUrl: "" });

            // 1. Autenticación
            useEffect(() => {
                if (!auth) return;
                const initAuth = async () => {
                    try {
                        const token = window.__initial_auth_token;
                        if (token) await auth.signInWithCustomToken(token);
                        else await auth.signInAnonymously();
                    } catch (error) { console.error("Auth error:", error); }
                };
                initAuth();
                return auth.onAuthStateChanged(u => setUser(u));
            }, []);

            // 2. Carga de Datos
            useEffect(() => {
                if (!user || !db) return;
                
                const productsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('products');
                const configRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('config').doc('site');

                const unsubConfig = configRef.onSnapshot(doc => {
                    if (doc.exists && doc.data().logo) setLogo(doc.data().logo);
                }, err => console.error("Error logo:", err));

                const unsubProducts = productsRef.onSnapshot(snap => {
                    const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setProducts(list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)));
                    setLoading(false);
                }, err => {
                    console.error("Error DB:", err);
                    setLoading(false);
                });

                return () => { unsubConfig(); unsubProducts(); };
            }, [user]);

            const handleLogin = (e) => {
                e.preventDefault();
                if (pass === "trend2024") { 
                    setIsAdmin(true); 
                    setShowLogin(false); 
                } else {
                    alert("Contraseña incorrecta");
                }
                setPass("");
            };

            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!imgbbKey) {
                    alert("Configura tu Clave API de ImgBB en el icono de Engrane primero.");
                    return;
                }

                setUploading(true);
                const formData = new FormData();
                formData.append("image", file);

                try {
                    const response = await fetch(`https://api.imgbb.com/1/upload?key=${imgbbKey}`, {
                        method: "POST",
                        body: formData
                    });
                    const data = await response.json();
                    if (data.success) setNewP({ ...newP, imageUrl: data.data.url });
                    else alert("Error al subir. Revisa tu clave de ImgBB.");
                } catch (error) { alert("Error de conexión al subir."); }
                finally { setUploading(false); }
            };

            const saveSettings = async () => {
                localStorage.setItem('imgbb_key', imgbbKey);
                if (!db) return;
                const configRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('config').doc('site');
                try {
                    await configRef.set({ logo: logo }, { merge: true });
                    setShowSettings(false);
                    alert("Ajustes guardados correctamente");
                } catch (err) { alert("Error al guardar en la nube."); }
            };

            const addProduct = async (e) => {
                e.preventDefault();
                if (!db) return;
                const productsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('products');
                try {
                    await productsRef.add({ ...newP, price: Number(newP.price), createdAt: Date.now() });
                    setShowAdd(false);
                    setNewP({ name: "", price: "", category: "Ropa", gender: "Mujer", size: "M", description: "", imageUrl: "" });
                } catch (err) { alert("Error al publicar."); }
            };

            const deleteP = async (id) => {
                if (!confirm("¿Eliminar prenda?")) return;
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('products').doc(id).delete();
                } catch (err) { alert("Error al eliminar."); }
            };

            const filtered = products.filter(p => 
                p.name.toLowerCase().includes(search.toLowerCase()) || 
                p.description?.toLowerCase().includes(search.toLowerCase())
            );

            return (
                <div className="min-h-screen">
                    <nav className="glass sticky top-0 z-50 p-4 border-b border-dorado/20">
                        <div className="max-w-7xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <img 
                                    src={logo || "https://placehold.co/100x100/1E3A5F/white?text=Trend"} 
                                    className="h-12 w-12 rounded-full border-2 border-dorado object-cover" 
                                    onError={(e) => e.target.src="https://placehold.co/100x100/1E3A5F/white?text=T"}
                                />
                                <div className="hidden sm:block">
                                    <h1 className="text-xl font-black color-azul leading-none uppercase">Trend Shop</h1>
                                    <span className="text-[9px] font-black text-magenta uppercase tracking-widest">Catálogo Online</span>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => isAdmin ? setIsAdmin(false) : setShowLogin(true)} className="p-3 rounded-full bg-white text-slate-400 hover:text-azul shadow-sm transition-all">
                                    <i className={`fas ${isAdmin ? 'fa-unlock' : 'fa-lock'}`}></i>
                                </button>
                                
                                {isAdmin && (
                                    <>
                                        <button onClick={() => setShowSettings(true)} className="p-3 rounded-full bg-amber-50 text-amber-600 shadow-sm hover:bg-amber-500 hover:text-white transition-all">
                                            <i className="fas fa-cog"></i>
                                        </button>
                                        <button onClick={() => setShowAdd(true)} className="bg-magenta text-white px-5 py-2 rounded-full font-black text-xs magenta-glow hover:scale-105 active:scale-95 transition-all">
                                            + PUBLICAR
                                        </button>
                                    </>
                                )}
                            </div>
                        </div>
                    </nav>

                    <header className="py-12 px-6 text-center">
                        <h2 className="text-5xl md:text-7xl font-black color-azul leading-[0.9] tracking-tighter mb-4 uppercase">
                            ROPA QUE <br/><span className="text-transparent bg-clip-text bg-vibrant italic">PARECE NUEVA</span>
                        </h2>
                        <p className="text-slate-500 font-bold max-w-lg mx-auto">Seleccionamos las mejores prendas para que estrenes estilo cada semana.</p>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 pb-20">
                        <div className="mb-8 relative">
                            <i className="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-dorado"></i>
                            <input 
                                type="text" placeholder="¿Qué buscas hoy?" 
                                className="w-full p-5 pl-12 rounded-3xl border-none shadow-inner bg-white outline-none font-bold"
                                value={search} onChange={e => setSearch(e.target.value)}
                            />
                        </div>

                        {loading ? (
                            <div className="text-center py-20">
                                <i className="fas fa-spinner fa-spin text-3xl text-dorado"></i>
                                <p className="mt-4 font-bold text-slate-400 uppercase text-xs">Sincronizando Catálogo...</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                                {filtered.map(p => (
                                    <div key={p.id} className="product-card flex flex-col group shadow-sm">
                                        <div className="aspect-[3/4] relative bg-slate-100">
                                            <img src={p.imageUrl} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" />
                                            <div className="absolute top-2 left-2 flex flex-col gap-1">
                                                <span className="bg-azul/90 text-white text-[8px] font-black px-2 py-1 rounded-full uppercase tracking-tighter">{p.gender}</span>
                                                <span className="bg-dorado/90 text-white text-[8px] font-black px-2 py-1 rounded-full uppercase tracking-tighter">Talla {p.size}</span>
                                            </div>
                                            {isAdmin && <button onClick={() => deleteP(p.id)} className="absolute top-2 right-2 bg-red-500 text-white p-2 rounded-full shadow-lg"><i className="fas fa-trash text-xs"></i></button>}
                                        </div>
                                        <div className="p-4 flex flex-col flex-1 bg-white">
                                            <div className="flex justify-between items-center mb-1">
                                                <span className="text-[9px] font-black text-magenta uppercase">{p.category}</span>
                                                <span className="text-xl font-black color-azul">${p.price}</span>
                                            </div>
                                            <h3 className="font-bold text-sm text-slate-800 line-clamp-2 h-10 mb-4 uppercase tracking-tighter leading-tight">{p.name}</h3>
                                            <button 
                                                onClick={() => window.open(`https://wa.me/525581019848?text=${encodeURIComponent(`¡Hola! Me encanta esto: ${p.name} ($${p.price}). ¿Sigue disponible?`)}`)}
                                                className="w-full py-3 bg-emerald-500 text-white rounded-2xl font-black text-[10px] shadow-lg animate-bounce-soft uppercase"
                                            >
                                                <i className="fab fa-whatsapp mr-1 text-base"></i> Lo quiero
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                        
                        {!loading && filtered.length === 0 && (
                            <div className="text-center py-20 bg-white/50 rounded-[3rem] border-4 border-dashed border-slate-200">
                                <i className="fas fa-search text-4xl text-slate-200 mb-4"></i>
                                <p className="font-bold text-slate-400 uppercase">No encontramos prendas con ese nombre</p>
                            </div>
                        )}
                    </main>

                    {/* MODALES */}
                    {showLogin && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-azul/80 backdrop-blur-md">
                            <div className="bg-white p-8 rounded-[2rem] max-w-xs w-full shadow-2xl">
                                <h3 className="text-center font-black mb-6 text-xs uppercase text-slate-400">Acceso Dueña</h3>
                                <form onSubmit={handleLogin}>
                                    <input type="password" placeholder="••••" autoFocus className="w-full p-4 bg-slate-100 rounded-2xl mb-4 text-center text-2xl tracking-[0.5em] outline-none border-2 border-transparent focus:border-magenta" value={pass} onChange={e => setPass(e.target.value)} />
                                    <button className="w-full py-4 bg-magenta text-white rounded-2xl font-black shadow-lg">ENTRAR</button>
                                </form>
                                <button onClick={() => setShowLogin(false)} className="w-full text-slate-300 text-[10px] font-black uppercase mt-4">Cancelar</button>
                            </div>
                        </div>
                    )}

                    {showSettings && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-azul/80 backdrop-blur-md overflow-y-auto">
                            <div className="bg-white p-8 rounded-[3rem] max-w-md w-full shadow-2xl my-10">
                                <h3 className="font-black mb-6 uppercase text-azul text-lg">Configuración</h3>
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-[10px] font-black uppercase color-azul ml-2">URL del Logo (.jpg o .png)</label>
                                        <input type="text" className="w-full p-4 bg-slate-50 rounded-2xl text-xs outline-none focus:ring-2 focus:ring-amber-500" value={logo} onChange={e => setLogo(e.target.value)} />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-black uppercase color-azul ml-2">Clave API de ImgBB</label>
                                        <p className="text-[8px] text-slate-400 ml-2 mb-1">Crea una gratis en api.imgbb.com para subir fotos automáticamente</p>
                                        <input type="text" placeholder="Pega tu clave aquí" className="w-full p-4 bg-slate-50 rounded-2xl text-xs outline-none focus:ring-2 focus:ring-amber-500" value={imgbbKey} onChange={e => setImgbbKey(e.target.value)} />
                                    </div>
                                    <button onClick={saveSettings} className="w-full py-4 bg-azul text-white rounded-2xl font-black shadow-xl">GUARDAR AJUSTES</button>
                                    <button onClick={() => setShowSettings(false)} className="w-full py-2 text-slate-300 text-[10px] font-black uppercase mt-2">Cerrar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showAdd && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-azul/80 backdrop-blur-md overflow-y-auto">
                            <div className="bg-white rounded-[3rem] w-full max-w-lg p-8 my-10 shadow-2xl">
                                <h3 className="text-2xl font-black color-azul mb-6 uppercase">NUEVA PRENDA</h3>
                                <form onSubmit={addProduct} className="space-y-4">
                                    <input required placeholder="Nombre de la prenda" className="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-magenta font-bold" value={newP.name} onChange={e => setNewP({...newP, name: e.target.value})} />
                                    
                                    <div className="flex gap-4">
                                        <div className="flex-1">
                                            <label className="text-[9px] font-black uppercase color-azul ml-3 opacity-50">Precio ($)</label>
                                            <input required type="number" className="w-full p-4 bg-slate-50 rounded-2xl outline-none font-black" value={newP.price} onChange={e => setNewP({...newP, price: e.target.value})} />
                                        </div>
                                        <div className="flex-1">
                                            <label className="text-[9px] font-black uppercase color-azul ml-3 opacity-50">Talla</label>
                                            <select className="w-full p-4 bg-slate-50 rounded-2xl outline-none cursor-pointer" value={newP.size} onChange={e => setNewP({...newP, size: e.target.value})}>
                                                {SIZES.map(s => <option key={s} value={s}>{s}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-black uppercase color-azul ml-4 flex justify-between items-center">
                                            Foto del artículo
                                            {uploading && <span className="text-magenta animate-pulse text-[8px] font-black">SUBIENDO...</span>}
                                        </label>
                                        <div className="flex gap-2">
                                            <input required placeholder="Link de la imagen" className="flex-1 p-4 bg-slate-50 rounded-2xl text-[10px] outline-none" value={newP.imageUrl} onChange={e => setNewP({...newP, imageUrl: e.target.value})} />
                                            <label className="cursor-pointer bg-magenta text-white w-14 rounded-2xl flex items-center justify-center hover:opacity-80 transition-all shadow-md">
                                                <i className={`fas ${uploading ? 'fa-spinner fa-spin' : 'fa-camera'} text-xl`}></i>
                                                <input type="file" className="hidden" accept="image/*" onChange={handleFileUpload} disabled={uploading} />
                                            </label>
                                        </div>
                                        <p className="text-[8px] text-slate-300 ml-4 font-bold uppercase italic">Icono cámara: Sube desde tu carrete</p>
                                    </div>

                                    <textarea placeholder="Descripción corta (ej. Como nuevo, tela fresca...)" className="w-full p-4 bg-slate-50 rounded-2xl h-24 outline-none focus:ring-2 focus:ring-magenta font-medium" value={newP.description} onChange={e => setNewP({...newP, description: e.target.value})}></textarea>
                                    
                                    <button className="w-full py-5 bg-magenta text-white rounded-3xl font-black shadow-xl" disabled={uploading}>
                                        {uploading ? "CARGANDO FOTO..." : "PUBLICAR PRENDA"}
                                    </button>
                                    <button type="button" onClick={() => setShowAdd(false)} className="w-full py-2 text-slate-300 font-bold uppercase text-[10px]">Cancelar</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Renderizado Final
        const rootElement = document.getElementById('root');
        if (rootElement) {
            const root = ReactDOM.createRoot(rootElement);
            root.render(<App />);
        }
    </script>
</body>
</html>
