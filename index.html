<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trend Shop | Catálogo Oficial</title>
    
    <meta name="description" content="Venta de ropa como nueva, calzado y accesorios. ¡Estilo increíble a precios de oportunidad! Envíos a todo México.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDKs (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #fdfcf0; color: #1E3A5F; margin: 0; }
        .bg-vibrant { background: linear-gradient(135deg, #FF0080 0%, #7928CA 100%); }
        .product-card { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); border-radius: 2.5rem; background: white; border: 1px solid rgba(0,0,0,0.05); }
        .product-card:hover { transform: translateY(-10px); box-shadow: 0 25px 50px rgba(0,0,0,0.1); }
        .magenta-glow { box-shadow: 0 10px 20px rgba(233, 30, 99, 0.2); }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        @keyframes bounce-soft { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .animate-bounce-soft { animation: bounce-soft 3s infinite; }
        .error-box { background: #fee2e2; border: 2px solid #ef4444; border-radius: 1.5rem; padding: 2rem; text-align: center; max-width: 400px; }
    </style>
</head>
<body>
    <div id="root">
        <div style="height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column;">
            <i class="fas fa-spinner fa-spin" style="font-size: 3rem; color: #FF0080;"></i>
            <p style="margin-top: 1rem; font-weight: 900; color: #1E3A5F; text-transform: uppercase; letter-spacing: 2px;">Iniciando Trend Shop...</p>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyDsg72_uPQzY_I3DDbBeW-lpk2ggAlvYHQ",
            authDomain: "trendshopcdmx.firebaseapp.com",
            projectId: "trendshopcdmx",
            storageBucket: "trendshopcdmx.firebasestorage.app",
            messagingSenderId: "909934554289",
            appId: "1:909934554289:web:23637e0736ec360df34690",
            measurementId: "G-Z0H3EYZ3TS"
        };

        // Prevención de errores de carga doble
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const WHATSAPP_NUMBER = "525581019848";
        const SIZES = ["XS", "S", "M", "L", "XL", "Única", "24", "25", "26", "27", "28", "29", "30", "31", "32"];

        function App() {
            const [user, setUser] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [products, setProducts] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [showAdd, setShowAdd] = useState(false);
            const [showLogin, setShowLogin] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [pass, setPass] = useState("");
            const [search, setSearch] = useState("");
            const [imgbbKey, setImgbbKey] = useState(localStorage.getItem('imgbb_key') || "");
            const [logo, setLogo] = useState(localStorage.getItem('site_logo') || "");
            const [uploading, setUploading] = useState(false);
            const [newP, setNewP] = useState({ name: "", price: "", category: "Ropa", gender: "Mujer", size: "M", description: "", imageUrl: "" });

            useEffect(() => {
                auth.signInAnonymously()
                    .then(cred => setUser(cred.user))
                    .catch(e => {
                        console.error("Auth Error:", e);
                        setError("Error de Autenticación: Asegúrate de habilitar 'Anónimo' en Firebase Authentication.");
                    });
            }, []);

            useEffect(() => {
                if (!user) return;

                const unsub = db.collection('products').onSnapshot(snap => {
                    const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setProducts(list.sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0)));
                    setLoading(false);
                    setError(null);
                }, (err) => {
                    console.error("Firestore Error:", err);
                    setError("Error de Permisos: Asegúrate de que las Reglas de Firestore permitan lectura/escritura.");
                    setLoading(false);
                });
                return unsub;
            }, [user]);

            const handleLogin = (e) => {
                e.preventDefault();
                if (pass === "trend2024") { setIsAdmin(true); setShowLogin(false); }
                else { alert("Contraseña incorrecta"); }
                setPass("");
            };

            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file || !imgbbKey) return alert("Configura tu Clave API de ImgBB en el Engrane primero.");
                setUploading(true);
                const fd = new FormData(); fd.append("image", file);
                try {
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${imgbbKey}`, { method: "POST", body: fd });
                    const data = await res.json();
                    if (data.success) setNewP(prev => ({ ...prev, imageUrl: data.data.url }));
                } finally { setUploading(false); }
            };

            const addProduct = async (e) => {
                e.preventDefault();
                try {
                    await db.collection('products').add({ ...newP, price: Number(newP.price), createdAt: Date.now() });
                    setShowAdd(false);
                    setNewP({ name: "", price: "", category: "Ropa", gender: "Mujer", size: "M", description: "", imageUrl: "" });
                } catch(e) { alert("Error al guardar. Revisa tus reglas de Firestore."); }
            };

            const deleteP = async (id) => {
                if (confirm("¿Eliminar prenda definitivamente?")) await db.collection('products').doc(id).delete();
            };

            const filtered = products.filter(p => p.name.toLowerCase().includes(search.toLowerCase()));

            if (error) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-slate-50">
                        <div className="error-box shadow-2xl">
                            <i className="fas fa-exclamation-triangle text-5xl text-red-500 mb-4 animate-bounce"></i>
                            <h2 className="font-black text-2xl mb-2 tracking-tighter">¡Ups! Algo falta</h2>
                            <p className="text-slate-500 text-sm mb-6 leading-relaxed">
                                {error} <br/> 
                                <span className="font-bold text-red-600">Revisa la pestaña "Authentication" -> "Sign-in method" en Firebase.</span>
                            </p>
                            <button onClick={() => window.location.reload()} className="bg-slate-800 text-white px-8 py-3 rounded-full font-black text-xs tracking-widest hover:scale-105 transition-transform">REINTENTAR</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen">
                    <nav className="glass sticky top-0 z-50 p-4 border-b border-pink-100 shadow-sm">
                        <div className="max-w-7xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <img src={logo || "https://placehold.co/100x100/1E3A5F/white?text=Trend"} className="h-12 w-12 rounded-full border-2 border-pink-500 object-cover" />
                                <div>
                                    <h1 className="text-xl font-black text-slate-800 tracking-tighter uppercase leading-none">Trend Shop</h1>
                                    <span className="text-[9px] font-bold text-pink-500 uppercase tracking-widest">Catálogo Online</span>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => isAdmin ? setIsAdmin(false) : setShowLogin(true)} className="p-3 rounded-full bg-white text-slate-400 hover:text-pink-500 shadow-sm transition-colors">
                                    <i className={`fas ${isAdmin ? 'fa-unlock' : 'fa-lock'}`}></i>
                                </button>
                                {isAdmin && (
                                    <>
                                        <button onClick={() => setShowSettings(true)} className="p-3 rounded-full bg-orange-50 text-orange-600 shadow-sm hover:bg-orange-100 transition-colors"><i className="fas fa-cog"></i></button>
                                        <button onClick={() => setShowAdd(true)} className="bg-vibrant text-white px-6 py-2 rounded-full font-black text-xs magenta-glow hover:scale-105 transition-transform">+ PUBLICAR</button>
                                    </>
                                )}
                            </div>
                        </div>
                    </nav>

                    <header className="py-16 px-6 text-center">
                        <h2 className="text-6xl md:text-8xl font-black text-slate-800 leading-[0.85] tracking-tighter mb-4 uppercase">
                            TU ESTILO <br/><span className="text-transparent bg-clip-text bg-vibrant italic">COMO NUEVO</span>
                        </h2>
                        <p className="text-slate-400 font-bold uppercase text-[10px] tracking-[0.3em]">Boutique Online Mexicana</p>
                    </header>

                    { }
                    <main className="max-w-7xl mx-auto px-4 pb-20">
                        <div className="mb-12 relative max-w-2xl mx-auto">
                            <i className="fas fa-search absolute left-6 top-1/2 -translate-y-1/2 text-pink-400 text-xl"></i>
                            <input type="text" placeholder="¿Qué buscas hoy?" className="w-full p-6 pl-14 rounded-full border-none shadow-2xl bg-white outline-none font-bold text-slate-700 focus:ring-2 focus:ring-pink-100" value={search} onChange={e => setSearch(e.target.value)} />
                        </div>

                        {loading ? (
                            <div className="text-center py-20 text-pink-500"><i className="fas fa-spinner fa-spin text-4xl"></i></div>
                        ) : (
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                                {filtered.map(p => (
                                    <div key={p.id} className="product-card group shadow-sm flex flex-col overflow-hidden bg-white border border-slate-50">
                                        <div className="aspect-[3/4] relative bg-slate-50 overflow-hidden">
                                            <img src={p.imageUrl} className="w-full h-full object-cover group-hover:scale-110 transition-all duration-700" alt={p.name} />
                                            <div className="absolute top-4 left-4 flex flex-col gap-2">
                                                <span className="glass px-3 py-1 rounded-full text-[9px] font-black uppercase tracking-tighter shadow-sm">{p.gender}</span>
                                                <span className="bg-slate-900 text-white px-3 py-1 rounded-full text-[9px] font-black uppercase shadow-sm">Talla {p.size}</span>
                                            </div>
                                            {isAdmin && <button onClick={() => deleteP(p.id)} className="absolute top-4 right-4 bg-red-500 text-white p-3 rounded-full shadow-xl hover:bg-red-600 transition-colors"><i className="fas fa-trash-alt"></i></button>}
                                        </div>
                                        <div className="p-6 flex flex-col flex-1">
                                            <div className="flex justify-between items-center mb-1">
                                                <span className="text-[10px] font-black text-pink-500 uppercase tracking-widest">{p.category}</span>
                                                <span className="text-2xl font-black text-slate-800">${p.price}</span>
                                            </div>
                                            <h3 className="font-bold text-sm text-slate-700 line-clamp-2 h-10 mb-1 uppercase leading-tight tracking-tight">{p.name}</h3>
                                            <button onClick={() => window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent('¡Hola! Me interesa esta prenda: ' + p.name + ' ($' + p.price + ')')}`)} className="w-full py-4 bg-emerald-500 text-white rounded-2xl font-black text-[10px] animate-bounce-soft uppercase shadow-xl hover:bg-emerald-600 transition-colors">
                                                <i className="fab fa-whatsapp mr-2 text-base"></i> Lo quiero
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {/* MODALES... */}
                    {showLogin && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-slate-900/80 backdrop-blur-md">
                            <div className="bg-white p-10 rounded-[3rem] max-w-xs w-full text-center shadow-2xl">
                                <h3 className="font-black mb-8 text-xs uppercase text-slate-400">Acceso Dueña</h3>
                                <form onSubmit={handleLogin}>
                                    <input type="password" placeholder="••••" autoFocus className="w-full p-5 bg-slate-100 rounded-3xl mb-6 text-center text-4xl tracking-[0.5em] outline-none focus:ring-2 focus:ring-pink-500" value={pass} onChange={e => setPass(e.target.value)} />
                                    <button className="w-full py-5 bg-slate-800 text-white rounded-3xl font-black shadow-xl hover:scale-105 transition-transform">ENTRAR</button>
                                </form>
                                <button onClick={() => setShowLogin(false)} className="mt-6 text-[10px] font-black text-slate-300 uppercase">Cancelar</button>
                            </div>
                        </div>
                    )}

                    {showSettings && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-slate-900/80 backdrop-blur-md overflow-y-auto">
                            <div className="bg-white p-10 rounded-[4rem] max-w-md w-full shadow-2xl my-10">
                                <h3 className="font-black mb-8 uppercase text-slate-800 text-2xl tracking-tighter">Ajustes</h3>
                                <div className="space-y-6">
                                    <div>
                                        <label className="text-[10px] font-black uppercase text-slate-400 ml-4 mb-2 block">Link de tu Logo</label>
                                        <input type="text" className="w-full p-5 bg-slate-50 rounded-3xl outline-none text-xs" value={logo} onChange={e => { setLogo(e.target.value); localStorage.setItem('site_logo', e.target.value); }} placeholder="https://..." />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-black uppercase text-slate-400 ml-4 mb-2 block">Clave API de ImgBB</label>
                                        <input type="text" className="w-full p-5 bg-slate-50 rounded-3xl outline-none font-mono text-xs" value={imgbbKey} onChange={e => { setImgbbKey(e.target.value); localStorage.setItem('imgbb_key', e.target.value); }} />
                                    </div>
                                    <div className="pt-6">
                                        <button onClick={() => setShowSettings(false)} className="w-full py-6 bg-pink-500 text-white rounded-3xl font-black shadow-2xl hover:scale-[1.02] transition-all uppercase text-xs tracking-widest">GUARDAR TODO</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {showAdd && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-md overflow-y-auto">
                            <div className="bg-white rounded-[4rem] w-full max-w-lg p-10 my-10 shadow-2xl">
                                <h3 className="text-3xl font-black text-slate-800 mb-8 uppercase tracking-tighter">NUEVA PRENDA</h3>
                                <form onSubmit={addProduct} className="space-y-6">
                                    <input required placeholder="¿Cómo se llama la prenda?" className="w-full p-5 bg-slate-50 rounded-3xl outline-none font-bold focus:ring-2 focus:ring-pink-500" value={newP.name} onChange={e => setNewP({...newP, name: e.target.value})} />
                                    <div className="flex gap-4">
                                        <div className="flex-1"><input required type="number" placeholder="Precio ($)" className="w-full p-5 bg-slate-50 rounded-3xl outline-none font-black" value={newP.price} onChange={e => setNewP({...newP, price: e.target.value})} /></div>
                                        <div className="flex-1">
                                            <select className="w-full p-5 bg-slate-50 rounded-3xl outline-none font-bold" value={newP.size} onChange={e => setNewP({...newP, size: e.target.value})}>
                                                {SIZES.map(s => <option key={s} value={s}>{s}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-black uppercase text-slate-800 ml-5 flex justify-between items-center">Foto {uploading && <span className="text-pink-500 animate-pulse text-[8px]">SUBIENDO...</span>}</label>
                                        <div className="flex gap-3">
                                            <input required placeholder="Link de imagen..." className="flex-1 p-5 bg-slate-50 rounded-3xl text-[10px] outline-none opacity-50" value={newP.imageUrl} readOnly />
                                            <label className="cursor-pointer bg-pink-500 text-white w-16 rounded-3xl flex items-center justify-center shadow-xl hover:bg-pink-600 transition-colors">
                                                <i className={`fas ${uploading ? 'fa-spinner fa-spin' : 'fa-camera'} text-2xl`}></i>
                                                <input type="file" className="hidden" accept="image/*" onChange={handleFileUpload} disabled={uploading} />
                                            </label>
                                        </div>
                                    </div>
                                    <textarea placeholder="Descripción (ej. Como nuevo, tela fresca...)" className="w-full p-6 bg-slate-50 rounded-[2.5rem] h-28 outline-none font-medium" value={newP.description} onChange={e => setNewP({...newP, description: e.target.value})}></textarea>
                                    <button className="w-full py-6 bg-pink-500 text-white rounded-3xl font-black shadow-2xl disabled:opacity-50 uppercase text-xs" disabled={uploading}>
                                        {uploading ? "CARGANDO FOTO..." : "PUBLICAR EN LA NUBE"}
                                    </button>
                                    <button type="button" onClick={() => setShowAdd(false)} className="w-full py-2 text-slate-400 font-bold uppercase text-[10px] text-center block">Cancelar</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
