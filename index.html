<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trend Shop | Ropa Increíble</title>
    
    <!-- SEO para que Google te encuentre -->
    <meta name="description" content="Venta de ropa como nueva, accesorios y calzado en Ciudad de México. ¡Estilo increíble a precios de oportunidad! Envíos a todo México.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
        
        body { 
            font-family: 'Outfit', sans-serif; 
            background: #fdfcf0; /* Crema suave */
            color: #1E3A5F;
        }

        /* Degradado vivo inspirado en el logo */
        .bg-vibrant-gradient {
            background: linear-gradient(135deg, #FF0080 0%, #7928CA 100%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        }

        .product-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 2rem;
        }

        .product-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }

        .magenta-glow {
            box-shadow: 0 0 20px rgba(233, 30, 99, 0.3);
        }

        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .animate-pulse-soft {
            animation: pulse-soft 2s infinite ease-in-out;
        }

        .color-azul { color: #1E3A5F; }
        .bg-azul { background-color: #1E3A5F; }
        .color-dorado { color: #D4AF37; }
        .bg-dorado { background-color: #D4AF37; }
        .bg-magenta { background-color: #E91E63; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const WHATSAPP_NUMBER = "525581019848";
        // Intentamos cargar el logo con respaldo
        const LOGO_IMG = "e336005e-4c7f-4578-a43c-ccc080b8def9_2.jpeg";
        
        const CATEGORIES = ["Ropa", "Calzado", "Accesorios"];
        const GENDERS = ["Mujer", "Hombre", "Unisex", "Infantil"];
        const SIZES = ["XS", "S", "M", "L", "XL", "Única", "24", "25", "26", "27", "28", "29", "30", "31", "32"];

        function App() {
            const [isAdmin, setIsAdmin] = useState(false);
            const [showLogin, setShowLogin] = useState(false);
            const [password, setPassword] = useState("");
            const [search, setSearch] = useState("");
            const [filterCat, setFilterCat] = useState("Todos");
            const [filterGen, setFilterGen] = useState("Todos");
            const [showAddModal, setShowAddModal] = useState(false);
            
            // Persistencia simple para demostración inmediata
            const [products, setProducts] = useState(() => {
                const saved = localStorage.getItem('trend_shop_data');
                return saved ? JSON.parse(saved) : [
                    { id: 1, name: "Chaqueta Denim Vintage", price: 450, category: "Ropa", gender: "Mujer", size: "M", imageUrl: "https://images.unsplash.com/photo-1543076447-215ad9ba6923?auto=format&fit=crop&q=80&w=800", description: "Estado impecable, color vibrante y ajuste perfecto." },
                    { id: 2, name: "Tenis Urbanos Blancos", price: 580, category: "Calzado", gender: "Hombre", size: "27", imageUrl: "https://images.unsplash.com/photo-1549298916-b41d501d3772?auto=format&fit=crop&q=80&w=800", description: "Súper cómodos, suela intacta, como nuevos." }
                ];
            });

            const [newP, setNewP] = useState({ name: "", price: "", category: "Ropa", gender: "Mujer", size: "M", description: "", imageUrl: "" });

            useEffect(() => {
                localStorage.setItem('trend_shop_data', JSON.stringify(products));
            }, [products]);

            const handleLogin = (e) => {
                e.preventDefault();
                if (password === "trend2024") {
                    setIsAdmin(true);
                    setShowLogin(false);
                } else {
                    alert("Contraseña incorrecta");
                }
                setPassword("");
            };

            const addProduct = (e) => {
                e.preventDefault();
                const p = { ...newP, id: Date.now(), price: Number(newP.price) };
                setProducts([p, ...products]);
                setShowAddModal(false);
                setNewP({ name: "", price: "", category: "Ropa", gender: "Mujer", size: "M", description: "", imageUrl: "" });
            };

            const deleteProduct = (id) => {
                if(confirm("¿Seguro que quieres eliminar esta prenda?")) {
                    setProducts(products.filter(p => p.id !== id));
                }
            };

            const filtered = useMemo(() => {
                return products.filter(p => {
                    const mSearch = p.name.toLowerCase().includes(search.toLowerCase());
                    const mCat = filterCat === "Todos" || p.category === filterCat;
                    const mGen = filterGen === "Todos" || p.gender === filterGen;
                    return mSearch && mCat && mGen;
                });
            }, [products, search, filterCat, filterGen]);

            return (
                <div className="min-h-screen">
                    {/* Navegación Alegre */}
                    <nav className="glass-card sticky top-0 z-50 px-4 py-4 border-b-2 border-dorado/30">
                        <div className="max-w-7xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-4">
                                <img 
                                    src={LOGO_IMG} 
                                    alt="Trend Shop Logo" 
                                    className="h-14 w-14 rounded-full border-2 border-dorado shadow-lg hover:scale-110 transition-transform cursor-pointer"
                                    onError={(e) => { e.target.src = 'https://placehold.co/100x100/1E3A5F/white?text=Trend'; }}
                                />
                                <div className="hidden sm:block">
                                    <h1 className="text-2xl font-black color-azul leading-none tracking-tighter">TREND SHOP</h1>
                                    <p className="text-[10px] font-black text-magenta uppercase tracking-[0.2em] animate-pulse">¡Abre Hoy!</p>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-3">
                                <button onClick={() => isAdmin ? setIsAdmin(false) : setShowLogin(true)} className="w-10 h-10 flex items-center justify-center rounded-full bg-slate-100 text-slate-500 hover:bg-dorado hover:text-white transition-all">
                                    <i className={`fas ${isAdmin ? 'fa-unlock' : 'fa-lock'}`}></i>
                                </button>
                                {isAdmin && (
                                    <button onClick={() => setShowAddModal(true)} className="bg-magenta text-white px-6 py-2 rounded-full font-black text-xs uppercase tracking-widest shadow-lg hover:scale-105 active:scale-95 transition-all magenta-glow">
                                        <i className="fas fa-plus mr-2"></i> PUBLICAR
                                    </button>
                                )}
                            </div>
                        </div>
                    </nav>

                    {/* Banner Dinámico */}
                    <header className="relative py-16 md:py-24 px-6 text-center overflow-hidden">
                        <div className="max-w-4xl mx-auto z-10 relative">
                            <div className="inline-block px-4 py-1 bg-magenta/10 text-magenta rounded-full text-[10px] font-black uppercase tracking-widest mb-6 border border-magenta/20">
                                🌟 Ropa que cuenta historias
                            </div>
                            <h2 className="text-5xl md:text-8xl font-black color-azul leading-[0.9] mb-6 tracking-tighter">
                                EL ESTILO <br/>
                                <span className="text-transparent bg-clip-text bg-vibrant-gradient italic">COMO NUEVO</span>
                            </h2>
                            <p className="text-slate-500 font-bold text-lg max-w-2xl mx-auto mb-8">
                                Seleccionamos las mejores prendas para que estrenes cada semana sin gastar de más. ¡Espectacular y sostenible!
                            </p>
                            <div className="flex justify-center gap-4">
                                <div className="flex items-center gap-2 bg-white px-4 py-2 rounded-full shadow-sm border border-slate-100 text-xs font-bold text-azul">
                                    <i className="fas fa-check-circle text-emerald-500"></i> Calidad 10/10
                                </div>
                                <div className="flex items-center gap-2 bg-white px-4 py-2 rounded-full shadow-sm border border-slate-100 text-xs font-bold text-azul">
                                    <i className="fas fa-bolt text-dorado"></i> Oportunidades Únicas
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Filtros Divertidos */}
                    <main className="max-w-7xl mx-auto px-4 pb-20">
                        <div className="glass-card p-4 rounded-[2.5rem] mb-12 flex flex-col md:flex-row gap-4 items-center">
                            <div className="relative w-full md:w-1/2">
                                <i className="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-dorado text-lg"></i>
                                <input 
                                    type="text" placeholder="¿Qué buscas para hoy?" 
                                    className="w-full pl-14 pr-6 py-5 bg-white rounded-3xl border-none focus:ring-4 focus:ring-dorado/20 outline-none font-bold text-slate-700 shadow-inner"
                                    value={search} onChange={(e) => setSearch(e.target.value)}
                                />
                            </div>
                            <div className="flex gap-3 w-full md:w-auto">
                                <select className="flex-1 md:flex-none p-5 bg-white border-none rounded-3xl text-xs font-black uppercase color-azul cursor-pointer hover:bg-slate-50 shadow-sm" value={filterCat} onChange={(e) => setFilterCat(e.target.value)}>
                                    <option value="Todos">Categorías</option>
                                    {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                                <select className="flex-1 md:flex-none p-5 bg-white border-none rounded-3xl text-xs font-black uppercase color-azul cursor-pointer hover:bg-slate-50 shadow-sm" value={filterGen} onChange={(e) => setFilterGen(e.target.value)}>
                                    <option value="Todos">Géneros</option>
                                    {GENDERS.map(g => <option key={g} value={g}>{g}</option>)}
                                </select>
                            </div>
                        </div>

                        {/* Catálogo en Cuadrícula */}
                        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 md:gap-10">
                            {filtered.map(p => (
                                <div key={p.id} className="product-card glass-card overflow-hidden flex flex-col h-full relative group">
                                    <div className="aspect-[3/4] relative overflow-hidden bg-slate-100">
                                        <img 
                                            src={p.imageUrl} 
                                            className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" 
                                            alt={p.name} 
                                            onError={(e) => { e.target.src = 'https://placehold.co/400x500/1E3A5F/white?text=Trend+Shop'; }}
                                        />
                                        <div className="absolute top-4 left-4 flex flex-col gap-2">
                                            <span className="bg-azul/90 backdrop-blur text-white px-3 py-1 rounded-full text-[9px] font-black uppercase tracking-widest shadow-lg">{p.gender}</span>
                                            <span className="bg-dorado/90 backdrop-blur text-white px-3 py-1 rounded-full text-[9px] font-black uppercase tracking-widest shadow-lg">Talla {p.size}</span>
                                        </div>
                                        {isAdmin && (
                                            <button onClick={() => deleteProduct(p.id)} className="absolute top-4 right-4 bg-red-500 text-white w-10 h-10 rounded-full shadow-lg hover:bg-red-600 flex items-center justify-center transition-all scale-0 group-hover:scale-100">
                                                <i className="fas fa-trash-alt"></i>
                                            </button>
                                        )}
                                    </div>
                                    <div className="p-6 flex flex-col flex-1">
                                        <div className="flex justify-between items-start mb-2">
                                            <span className="text-[10px] font-black text-magenta uppercase tracking-[0.2em]">{p.category}</span>
                                            <span className="text-2xl font-black color-azul">${p.price}</span>
                                        </div>
                                        <h3 className="font-bold text-slate-800 text-base mb-2 leading-tight line-clamp-2 h-12 uppercase tracking-tight">{p.name}</h3>
                                        <p className="text-xs text-slate-500 mb-6 line-clamp-2 font-medium italic">"{p.description}"</p>
                                        
                                        <button 
                                            onClick={() => window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(`¡Hola! Me encanta esto: ${p.name} ($${p.price}) que vi en tu tienda. ¿Aún está disponible?`)}`, '_blank')}
                                            className="mt-auto w-full py-4 bg-emerald-500 text-white rounded-2xl font-black text-[11px] uppercase tracking-widest flex items-center justify-center gap-2 hover:bg-emerald-600 animate-pulse-soft transition-all shadow-xl shadow-emerald-200"
                                        >
                                            <i className="fab fa-whatsapp text-lg"></i> ¡LO QUIERO!
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {filtered.length === 0 && (
                            <div className="text-center py-32 bg-white/50 rounded-[4rem] border-4 border-dashed border-dorado/20">
                                <i className="fas fa-shopping-bag text-6xl text-dorado/20 mb-6"></i>
                                <h3 className="text-2xl font-black text-slate-400 uppercase">Aún no hay prendas aquí</h3>
                                <p className="text-slate-400 font-bold">¡Vuelve pronto o prueba con otro filtro!</p>
                            </div>
                        )}
                    </main>

                    {/* Pie de Página */}
                    <footer className="bg-azul text-white py-20 px-6 rounded-t-[4rem]">
                        <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-16">
                            <div className="text-center md:text-left">
                                <div className="flex items-center justify-center md:justify-start gap-4 mb-6">
                                    <img src={LOGO_IMG} className="h-12 w-12 rounded-full border-2 border-white/20" onError={(e) => { e.target.src = 'https://placehold.co/50x50/white/1E3A5F?text=T'; }}/>
                                    <h4 className="text-3xl font-black tracking-tighter">TREND SHOP</h4>
                                </div>
                                <p className="text-slate-400 font-medium">Moda accesible y consciente. Damos una segunda vida a las mejores prendas para que luzcas espectacular.</p>
                            </div>
                            
                            <div className="bg-white/5 p-8 rounded-[3rem] border border-white/10 text-center">
                                <h5 className="font-black text-dorado text-xs mb-4 uppercase tracking-[0.3em]">¿Dudas? Escríbeme</h5>
                                <div className="text-3xl font-black mb-4 tracking-tighter hover:text-magenta transition-colors cursor-pointer">558 101 9848</div>
                                <div className="text-[10px] font-black bg-emerald-500 text-white px-6 py-2 rounded-full inline-flex items-center gap-2 uppercase shadow-lg">
                                    <i className="fas fa-truck"></i> Envíos a todo México
                                </div>
                            </div>

                            <div className="flex flex-col justify-center items-center md:items-end gap-6">
                                <p className="text-slate-400 text-xs font-black uppercase tracking-widest">Encuéntranos en redes</p>
                                <div className="flex gap-4">
                                    <button className="w-14 h-14 bg-white/10 rounded-2xl flex items-center justify-center hover:bg-magenta hover:scale-110 transition-all text-2xl shadow-xl"><i className="fab fa-instagram"></i></button>
                                    <button className="w-14 h-14 bg-white/10 rounded-2xl flex items-center justify-center hover:bg-azul hover:border-2 hover:border-dorado hover:scale-110 transition-all text-2xl shadow-xl"><i className="fab fa-facebook-f"></i></button>
                                </div>
                            </div>
                        </div>
                        <div className="max-w-7xl mx-auto mt-20 pt-8 border-t border-white/5 text-center text-[10px] text-slate-500 font-black uppercase tracking-[0.5em]">
                            Viste increíble con Trend Shop • 2024
                        </div>
                    </footer>

                    {/* Modales de Gestión */}
                    {showLogin && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-azul/95 backdrop-blur-xl">
                            <div className="bg-white p-10 rounded-[3rem] max-w-sm w-full shadow-2xl border-t-[12px] border-magenta animate-pulse-soft">
                                <h2 className="text-3xl font-black text-center mb-8 color-azul tracking-tighter uppercase">ACCESO DUEÑA</h2>
                                <form onSubmit={handleLogin} className="space-y-4">
                                    <input 
                                        type="password" placeholder="••••" autoFocus
                                        className="w-full p-6 bg-slate-100 rounded-3xl border-none font-black text-center tracking-[0.5em] outline-none text-3xl focus:ring-4 focus:ring-magenta/20"
                                        value={password} onChange={(e) => setPassword(e.target.value)}
                                    />
                                    <button className="w-full py-5 bg-magenta text-white rounded-3xl font-black uppercase text-xs tracking-widest shadow-xl magenta-glow active:scale-95 transition-all">Entrar al Catálogo</button>
                                    <button type="button" onClick={() => setShowLogin(false)} className="w-full text-slate-400 text-[10px] font-black uppercase text-center pt-4 tracking-widest">Cerrar</button>
                                </form>
                                <p className="text-[8px] text-center text-slate-300 mt-6 uppercase">Contraseña actual: trend2024</p>
                            </div>
                        </div>
                    )}

                    {showAddModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-azul/90 backdrop-blur-md overflow-y-auto">
                            <div className="bg-white rounded-[4rem] w-full max-w-2xl my-8 shadow-2xl animate-in slide-in-from-bottom duration-300">
                                <div className="p-10 border-b border-slate-100 flex justify-between items-center bg-slate-50/50 rounded-t-[4rem]">
                                    <div>
                                        <h2 className="text-3xl font-black color-azul uppercase tracking-tighter leading-none">NUEVA PRENDA</h2>
                                        <p className="text-[10px] font-bold text-magenta uppercase tracking-widest mt-2">¡Sube lo más nuevo!</p>
                                    </div>
                                    <button onClick={() => setShowAddModal(false)} className="w-12 h-12 bg-white rounded-full flex items-center justify-center hover:bg-red-50 text-slate-400 hover:text-red-500 transition-all shadow-md"><i className="fas fa-times"></i></button>
                                </div>
                                <form onSubmit={addProduct} className="p-10 space-y-8">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black uppercase color-azul ml-4 tracking-widest opacity-50">Nombre</label>
                                            <input required placeholder="Ej. Vestido Floral" className="w-full p-5 bg-slate-50 rounded-3xl outline-none border-2 border-transparent focus:border-magenta font-bold shadow-inner" value={newP.name} onChange={(e) => setNewP({...newP, name: e.target.value})} />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black uppercase color-azul ml-4 tracking-widest opacity-50">Precio ($)</label>
                                            <input required type="number" placeholder="0.00" className="w-full p-5 bg-slate-50 rounded-3xl outline-none border-2 border-transparent focus:border-magenta font-black text-xl shadow-inner" value={newP.price} onChange={(e) => setNewP({...newP, price: e.target.value})} />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black uppercase color-azul ml-4 tracking-widest opacity-50">Categoría</label>
                                            <select className="w-full p-5 bg-slate-50 rounded-3xl outline-none font-bold cursor-pointer shadow-sm" value={newP.category} onChange={(e) => setNewP({...newP, category: e.target.value})}>
                                                {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black uppercase color-azul ml-4 tracking-widest opacity-50">Género</label>
                                            <select className="w-full p-5 bg-slate-50 rounded-3xl outline-none font-bold cursor-pointer shadow-sm" value={newP.gender} onChange={(e) => setNewP({...newP, gender: e.target.value})}>
                                                {GENDERS.map(g => <option key={g} value={g}>{g}</option>)}
                                            </select>
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black uppercase color-azul ml-4 tracking-widest opacity-50">Talla</label>
                                            <select className="w-full p-5 bg-slate-50 rounded-3xl outline-none font-bold cursor-pointer shadow-sm" value={newP.size} onChange={(e) => setNewP({...newP, size: e.target.value})}>
                                                {SIZES.map(s => <option key={s} value={s}>{s}</option>)}
                                            </select>
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black uppercase color-azul ml-4 tracking-widest opacity-50">Link de Imagen</label>
                                            <input required placeholder="Copia el link aquí" className="w-full p-5 bg-slate-50 rounded-3xl outline-none border-2 border-transparent focus:border-magenta text-xs shadow-inner" value={newP.imageUrl} onChange={(e) => setNewP({...newP, imageUrl: e.target.value})} />
                                        </div>
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-black uppercase color-azul ml-4 tracking-widest opacity-50">Estado de la prenda</label>
                                        <textarea placeholder="Ej. Como nuevo, tela fresca..." className="w-full p-6 bg-slate-50 rounded-[2.5rem] outline-none h-24 font-medium shadow-inner" value={newP.description} onChange={(e) => setNewP({...newP, description: e.target.value})}></textarea>
                                    </div>
                                    <button type="submit" className="w-full py-6 bg-magenta text-white font-black rounded-3xl uppercase tracking-widest shadow-2xl magenta-glow hover:scale-[1.01] active:scale-95 transition-all mt-4">¡SUBIR AL CATÁLOGO!</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
