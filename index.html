<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- VISTA PREVIA PARA WHATSAPP / REDES SOCIALES -->
    <title>Trend Shop | Tu Estilo Más Trend</title>
    <meta name="description" content="Boutique Online Mexicana - Ropa, Calzado y Accesorios como nuevos.">
    <meta property="og:title" content="Trend Shop | Tu Estilo Más Trend">
    <meta property="og:description" content="Descubre nuestra curaduría de ropa y calzado. ¡Compra directo por WhatsApp!">
    <meta property="og:image" content="e336005e-4c7f-4578-a43c-ccc080b8def9_2.jpeg">
    <meta property="og:type" content="website">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #fdfcf0; color: #1E3A5F; margin: 0; }
        .bg-vibrant { background: linear-gradient(135deg, #FF0080 0%, #7928CA 100%); }
        .product-card { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); border-radius: 2.5rem; background: white; border: 1px solid rgba(0,0,0,0.05); }
        .product-card:hover { transform: translateY(-10px); box-shadow: 0 25px 50px rgba(0,0,0,0.1); }
        .magenta-glow { box-shadow: 0 10px 20px rgba(233, 30, 99, 0.2); }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .category-pill { transition: all 0.3s ease; cursor: pointer; white-space: nowrap; }
        .category-pill.active { background: #E91E63; color: white; transform: scale(1.05); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Configuración de Firebase Hardcoded para persistencia total
        const firebaseConfig = {
            apiKey: "AIzaSyDsg72_uPQzY_I3DDbBeW-lpk2ggAlvYHQ",
            authDomain: "trendshopcdmx.firebaseapp.com",
            projectId: "trendshopcdmx",
            storageBucket: "trendshopcdmx.firebasestorage.app",
            messagingSenderId: "909934554289",
            appId: "1:909934554289:web:23637e0736ec360df34690",
            measurementId: "G-Z0H3EYZ3TS"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const WHATSAPP_NUMBER = "525581019848";
        const CATEGORIES = ["Mujer", "Hombre", "Bebe", "Accesorios", "Calzado Mujer", "Calzado Hombre"];

        function App() {
            const [user, setUser] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [products, setProducts] = useState([]);
            const [loading, setLoading] = useState(true);
            const [showAdd, setShowAdd] = useState(false);
            const [showLogin, setShowLogin] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [pass, setPass] = useState("");
            const [search, setSearch] = useState("");
            const [activeCat, setActiveCat] = useState("Todos");
            
            const [imgbbKey, setImgbbKey] = useState(localStorage.getItem('imgbb_key') || "");
            const [logo, setLogo] = useState(localStorage.getItem('site_logo') || "e336005e-4c7f-4578-a43c-ccc080b8def9_2.jpeg");
            const [uploading, setUploading] = useState(false);
            
            const [newP, setNewP] = useState({ 
                name: "", price: "", category: "Mujer", brand: "", size: "", description: "", imageUrl: "" 
            });

            useEffect(() => {
                auth.signInAnonymously().catch(e => console.error(e));
                return auth.onAuthStateChanged(u => setUser(u));
            }, []);

            useEffect(() => {
                if (!user) return;
                // Escuchador en tiempo real: los datos nunca se borran del servidor
                const unsub = db.collection('products').onSnapshot(snap => {
                    const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setProducts(list.sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0)));
                    setLoading(false);
                }, (err) => {
                    console.error("Error Firestore:", err);
                    setLoading(false);
                });
                return unsub;
            }, [user]);

            const handleLogin = (e) => {
                e.preventDefault();
                if (pass === "trend2024") { setIsAdmin(true); setShowLogin(false); }
                else { alert("Contraseña incorrecta"); }
                setPass("");
            };

            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file || !imgbbKey) return alert("Configura tu Clave API de ImgBB en el Engrane primero.");
                setUploading(true);
                const fd = new FormData(); fd.append("image", file);
                try {
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${imgbbKey}`, { method: "POST", body: fd });
                    const data = await res.json();
                    if (data.success) setNewP(prev => ({ ...prev, imageUrl: data.data.url }));
                } finally { setUploading(false); }
            };

            const addProduct = async (e) => {
                e.preventDefault();
                try {
                    await db.collection('products').add({ 
                        ...newP, 
                        price: Number(newP.price), 
                        createdAt: Date.now() 
                    });
                    setShowAdd(false);
                    setNewP({ name: "", price: "", category: "Mujer", brand: "", size: "", description: "", imageUrl: "" });
                } catch(e) { alert("Error al guardar en la nube."); }
            };

            const deleteP = async (id) => {
                if (confirm("¿Eliminar este artículo definitivamente?")) await db.collection('products').doc(id).delete();
            };

            const filtered = products.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(search.toLowerCase()) || (p.brand && p.brand.toLowerCase().includes(search.toLowerCase()));
                const matchesCat = activeCat === "Todos" || p.category === activeCat;
                return matchesSearch && matchesCat;
            });

            return (
                <div className="min-h-screen">
                    {/* Barra de Navegación */}
                    <nav className="glass sticky top-0 z-50 p-4 border-b border-pink-100 shadow-sm">
                        <div className="max-w-7xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <img src={logo} className="h-12 w-12 rounded-full border-2 border-pink-500 object-cover" />
                                <div>
                                    <h1 className="text-xl font-black text-slate-800 tracking-tighter uppercase leading-none">Trend Shop</h1>
                                    <span className="text-[9px] font-bold text-pink-500 uppercase tracking-widest italic">Boutique Online</span>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => isAdmin ? setIsAdmin(false) : setShowLogin(true)} className="p-3 rounded-full bg-white text-slate-400 hover:text-pink-500 shadow-sm transition-colors">
                                    <i className={`fas ${isAdmin ? 'fa-unlock' : 'fa-lock'}`}></i>
                                </button>
                                {isAdmin && (
                                    <>
                                        <button onClick={() => setShowSettings(true)} className="p-3 rounded-full bg-orange-50 text-orange-600 shadow-sm hover:bg-orange-100 transition-colors"><i className="fas fa-cog"></i></button>
                                        <button onClick={() => setShowAdd(true)} className="bg-vibrant text-white px-6 py-2 rounded-full font-black text-xs magenta-glow hover:scale-105 transition-transform uppercase">+ PUBLICAR</button>
                                    </>
                                )}
                            </div>
                        </div>
                    </nav>

                    {/* Hero Section */}
                    <header className="py-16 px-6 text-center">
                        <h2 className="text-6xl md:text-8xl font-black text-slate-800 leading-[0.85] tracking-tighter mb-4 uppercase">
                            TU ESTILO <br/><span className="text-transparent bg-clip-text bg-vibrant italic">MAS TREND</span>
                        </h2>
                        <p className="text-slate-400 font-bold uppercase text-[10px] tracking-[0.3em]">Boutique Online Mexicana</p>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 pb-20">
                        {/* Buscador */}
                        <div className="mb-8 relative max-w-2xl mx-auto">
                            <i className="fas fa-search absolute left-6 top-1/2 -translate-y-1/2 text-pink-400 text-xl"></i>
                            <input type="text" placeholder="¿Buscas una marca o prenda?" className="w-full p-6 pl-14 rounded-full border-none shadow-2xl bg-white outline-none font-bold text-slate-700 focus:ring-2 focus:ring-pink-100" value={search} onChange={e => setSearch(e.target.value)} />
                        </div>

                        {/* Barra de Secciones (Filtros) */}
                        <div className="flex gap-3 overflow-x-auto pb-8 no-scrollbar scroll-smooth">
                            <button onClick={() => setActiveCat("Todos")} className={`category-pill px-6 py-3 rounded-full font-black text-xs uppercase tracking-widest shadow-sm ${activeCat === "Todos" ? 'active' : 'bg-white text-slate-400'}`}>Todos</button>
                            {CATEGORIES.map(cat => (
                                <button key={cat} onClick={() => setActiveCat(cat)} className={`category-pill px-6 py-3 rounded-full font-black text-xs uppercase tracking-widest shadow-sm ${activeCat === cat ? 'active' : 'bg-white text-slate-400'}`}>{cat}</button>
                            ))}
                        </div>

                        {/* Galería de Productos */}
                        {loading ? (
                            <div className="text-center py-20 text-pink-500"><i className="fas fa-spinner fa-spin text-4xl"></i></div>
                        ) : (
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                                {filtered.map(p => (
                                    <div key={p.id} className="product-card group shadow-sm flex flex-col overflow-hidden bg-white border border-slate-50">
                                        <div className="aspect-[3/4] relative bg-slate-50 overflow-hidden">
                                            <img src={p.imageUrl} className="w-full h-full object-cover group-hover:scale-110 transition-all duration-700" alt={p.name} />
                                            <div className="absolute top-4 left-4 flex flex-col gap-2">
                                                <span className="glass px-3 py-1 rounded-full text-[9px] font-black uppercase tracking-tighter shadow-sm">{p.category}</span>
                                                {p.brand && <span className="bg-slate-900 text-white px-3 py-1 rounded-full text-[9px] font-black uppercase shadow-sm">{p.brand}</span>}
                                            </div>
                                            {isAdmin && <button onClick={() => deleteP(p.id)} className="absolute top-4 right-4 bg-red-500 text-white p-3 rounded-full shadow-xl hover:bg-red-600 transition-colors"><i className="fas fa-trash-alt"></i></button>}
                                        </div>
                                        <div className="p-6 flex flex-col flex-1">
                                            <div className="flex justify-between items-center mb-1">
                                                <span className="text-[10px] font-black text-pink-500 uppercase tracking-widest">Talla: {p.size || "Única"}</span>
                                                <span className="text-2xl font-black text-slate-800">${p.price}</span>
                                            </div>
                                            <h3 className="font-bold text-sm text-slate-700 line-clamp-2 h-10 mb-3 uppercase leading-tight tracking-tight">{p.name}</h3>
                                            <button onClick={() => window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent('¡Hola! Me interesa este artículo de Trend Shop: ' + p.name + ' (' + (p.brand || '') + ') $' + p.price)}`)} className="w-full py-4 bg-emerald-500 text-white rounded-2xl font-black text-[10px] uppercase shadow-xl hover:bg-emerald-600 transition-colors">
                                                <i className="fab fa-whatsapp mr-2 text-base"></i> Lo quiero
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    <footer className="bg-white border-t border-pink-50 py-20 px-6 text-center">
                        <div className="max-w-2xl mx-auto space-y-6">
                            <h4 className="text-2xl font-black text-slate-800 uppercase tracking-tighter">¿Tienes dudas sobre una prenda?</h4>
                            <p className="text-slate-400 text-sm font-medium">Contáctanos directamente para más fotos, medidas o detalles de envío.</p>
                            <button onClick={() => window.open(`https://wa.me/${WHATSAPP_NUMBER}`)} className="bg-slate-900 text-white px-10 py-5 rounded-full font-black text-xs uppercase tracking-[0.2em] shadow-2xl hover:scale-105 transition-transform flex items-center gap-3 mx-auto">
                                <i className="fab fa-whatsapp text-xl text-emerald-400"></i> Chatear con la Dueña
                            </button>
                            <div className="pt-10">
                                <p className="text-[10px] font-black text-slate-300 uppercase tracking-widest">Trend Shop © 2024 • Ciudad de México</p>
                            </div>
                        </div>
                    </footer>

                    {/* MODALES DE ADMINISTRACIÓN */}
                    {showLogin && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-slate-900/80 backdrop-blur-md">
                            <div className="bg-white p-10 rounded-[3rem] max-w-xs w-full text-center shadow-2xl">
                                <h3 className="font-black mb-8 text-xs uppercase text-slate-400">Acceso Dueña</h3>
                                <form onSubmit={handleLogin}>
                                    <input type="password" placeholder="••••" autoFocus className="w-full p-5 bg-slate-100 rounded-3xl mb-6 text-center text-4xl tracking-[0.5em] outline-none focus:ring-2 focus:ring-pink-500" value={pass} onChange={e => setPass(e.target.value)} />
                                    <button className="w-full py-5 bg-slate-800 text-white rounded-3xl font-black shadow-xl hover:scale-105 transition-transform">ENTRAR</button>
                                </form>
                                <button onClick={() => setShowLogin(false)} className="mt-6 text-[10px] font-black text-slate-300 uppercase">Cancelar</button>
                            </div>
                        </div>
                    )}

                    {showAdd && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-md overflow-y-auto">
                            <div className="bg-white rounded-[4rem] w-full max-w-lg p-10 my-10 shadow-2xl">
                                <h3 className="text-3xl font-black text-slate-800 mb-8 uppercase tracking-tighter">NUEVA PRENDA</h3>
                                <form onSubmit={addProduct} className="space-y-6">
                                    <input required placeholder="¿Cómo se llama la prenda?" className="w-full p-5 bg-slate-50 rounded-3xl outline-none font-bold focus:ring-2 focus:ring-pink-500" value={newP.name} onChange={e => setNewP({...newP, name: e.target.value})} />
                                    
                                    <div className="flex gap-4">
                                        <div className="flex-1"><input required type="number" placeholder="Precio ($)" className="w-full p-5 bg-slate-50 rounded-3xl outline-none font-black" value={newP.price} onChange={e => setNewP({...newP, price: e.target.value})} /></div>
                                        <div className="flex-1">
                                            <input placeholder="Marca (ej. Zara)" className="w-full p-5 bg-slate-50 rounded-3xl outline-none font-bold" value={newP.brand} onChange={e => setNewP({...newP, brand: e.target.value})} />
                                        </div>
                                    </div>

                                    <div className="flex gap-4">
                                        <div className="flex-1">
                                            <select className="w-full p-5 bg-slate-50 rounded-3xl outline-none font-bold" value={newP.category} onChange={e => setNewP({...newP, category: e.target.value})}>
                                                {CATEGORIES.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                                            </select>
                                        </div>
                                        <div className="flex-1">
                                            <input placeholder="Talla (Escribe libre)" className="w-full p-5 bg-slate-50 rounded-3xl outline-none font-bold" value={newP.size} onChange={e => setNewP({...newP, size: e.target.value})} />
                                        </div>
                                    </div>

                                    <div className="space-y-2">
                                        <label className="text-[10px] font-black uppercase text-slate-800 ml-5 flex justify-between items-center">Foto {uploading && <span className="text-pink-500 animate-pulse text-[8px]">SUBIENDO...</span>}</label>
                                        <div className="flex gap-3">
                                            <input required placeholder="Link de imagen..." className="flex-1 p-5 bg-slate-50 rounded-3xl text-[10px] outline-none opacity-50" value={newP.imageUrl} readOnly />
                                            <label className="cursor-pointer bg-pink-500 text-white w-16 rounded-3xl flex items-center justify-center shadow-xl hover:bg-pink-600 transition-colors">
                                                <i className={`fas ${uploading ? 'fa-spinner fa-spin' : 'fa-camera'} text-2xl`}></i>
                                                <input type="file" className="hidden" accept="image/*" onChange={handleFileUpload} disabled={uploading} />
                                            </label>
                                        </div>
                                    </div>
                                    <textarea placeholder="Descripción (ej. Como nuevo, tela fresca...)" className="w-full p-6 bg-slate-50 rounded-[2.5rem] h-28 outline-none font-medium" value={newP.description} onChange={e => setNewP({...newP, description: e.target.value})}></textarea>
                                    <button className="w-full py-6 bg-pink-500 text-white rounded-3xl font-black shadow-2xl disabled:opacity-50 uppercase text-xs" disabled={uploading}>
                                        {uploading ? "CARGANDO FOTO..." : "PUBLICAR EN LA NUBE"}
                                    </button>
                                    <button type="button" onClick={() => setShowAdd(false)} className="w-full py-2 text-slate-400 font-bold uppercase text-[10px] text-center block">Cancelar</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {showSettings && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-slate-900/80 backdrop-blur-md overflow-y-auto">
                            <div className="bg-white p-10 rounded-[4rem] max-w-md w-full shadow-2xl my-10">
                                <h3 className="font-black mb-8 uppercase text-slate-800 text-2xl tracking-tighter">Ajustes</h3>
                                <div className="space-y-6">
                                    <div>
                                        <label className="text-[10px] font-black uppercase text-slate-400 ml-4 mb-2 block">Link de tu Logo</label>
                                        <input type="text" className="w-full p-5 bg-slate-50 rounded-3xl outline-none text-xs" value={logo} onChange={e => { setLogo(e.target.value); localStorage.setItem('site_logo', e.target.value); }} placeholder="https://..." />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-black uppercase text-slate-400 ml-4 mb-2 block">Clave API de ImgBB</label>
                                        <input type="text" className="w-full p-5 bg-slate-50 rounded-3xl outline-none font-mono text-xs" value={imgbbKey} onChange={e => { setImgbbKey(e.target.value); localStorage.setItem('imgbb_key', e.target.value); }} />
                                    </div>
                                    <div className="pt-6">
                                        <button onClick={() => setShowSettings(false)} className="w-full py-6 bg-pink-500 text-white rounded-3xl font-black shadow-2xl hover:scale-[1.02] transition-all uppercase text-xs tracking-widest">GUARDAR TODO</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
