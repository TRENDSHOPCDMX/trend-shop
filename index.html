<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trend Shop | Ropa que enamora</title>
    <meta name="description" content="Catálogo online de ropa como nueva, accesorios y calzado. ¡Estilo increíble a precios de oportunidad!">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
        
        body { font-family: 'Outfit', sans-serif; background: #fdfcf0; color: #1E3A5F; overflow-x: hidden; }
        .bg-vibrant { background: linear-gradient(135deg, #FF0080 0%, #7928CA 100%); }
        .product-card { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); border-radius: 2rem; overflow: hidden; background: white; }
        .product-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .magenta-glow { box-shadow: 0 0 15px rgba(233, 30, 99, 0.3); }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); }
        @keyframes bounce-soft { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .animate-bounce-soft { animation: bounce-soft 3s infinite; }
        .color-azul { color: #1E3A5F; }
        .color-magenta { color: #E91E63; }
        .bg-magenta { background-color: #E91E63; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const firebaseConfig = JSON.parse(window.__firebase_config || '{}');
        const appId = window.__app_id || 'trend-shop-cdmx';
        const initialAuthToken = window.__initial_auth_token;

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const CATEGORIES = ["Ropa", "Calzado", "Accesorios"];
        const GENDERS = ["Mujer", "Hombre", "Unisex", "Infantil"];
        const SIZES = ["XS", "S", "M", "L", "XL", "Única", "24", "25", "26", "27", "28", "29", "30", "32"];

        function App() {
            const [user, setUser] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [products, setProducts] = useState([]);
            const [loading, setLoading] = useState(true);
            const [showAdd, setShowAdd] = useState(false);
            const [showLogin, setShowLogin] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [pass, setPass] = useState("");
            const [search, setSearch] = useState("");
            const [logo, setLogo] = useState("https://placehold.co/200x200/1E3A5F/white?text=Trend+Shop");
            const [imgbbKey, setImgbbKey] = useState(localStorage.getItem('imgbb_key') || "");
            const [uploading, setUploading] = useState(false);
            
            const [newP, setNewP] = useState({ name: "", price: "", category: "Ropa", gender: "Mujer", size: "M", description: "", imageUrl: "" });

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (initialAuthToken) await auth.signInWithCustomToken(initialAuthToken);
                        else await auth.signInAnonymously();
                    } catch (error) { console.error("Auth error:", error); }
                };
                initAuth();
                const unsubscribe = auth.onAuthStateChanged(u => setUser(u));
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const productsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('products');
                const configRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('config').doc('site');

                const unsubConfig = configRef.onSnapshot(doc => {
                    if (doc.exists && doc.data().logo) setLogo(doc.data().logo);
                }, err => console.error("Logo fetch error:", err));

                const unsubProducts = productsRef.onSnapshot(snap => {
                    const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setProducts(list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)));
                    setLoading(false);
                }, err => {
                    console.error("Firestore error:", err);
                    setLoading(false);
                });

                return () => { unsubConfig(); unsubProducts(); };
            }, [user]);

            const handleLogin = (e) => {
                e.preventDefault();
                if (pass === "trend2024") { 
                    setIsAdmin(true); 
                    setShowLogin(false); 
                } else {
                    alert("Contraseña incorrecta");
                }
                setPass("");
            };

            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                if (!imgbbKey) {
                    alert("Por favor, primero configura tu Clave API de ImgBB en el icono de Engrane");
                    return;
                }

                setUploading(true);
                const formData = new FormData();
                formData.append("image", file);

                try {
                    const response = await fetch(`https://api.imgbb.com/1/upload?key=${imgbbKey}`, {
                        method: "POST",
                        body: formData
                    });
                    const data = await response.json();
                    if (data.success) {
                        setNewP({ ...newP, imageUrl: data.data.url });
                    } else {
                        alert("Error al subir imagen. Revisa tu Clave API.");
                    }
                } catch (error) {
                    alert("Error de conexión al subir la foto.");
                } finally {
                    setUploading(false);
                }
            };

            const saveSettings = async () => {
                localStorage.setItem('imgbb_key', imgbbKey);
                const configRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('config').doc('site');
                try {
                    await configRef.set({ logo: logo }, { merge: true });
                    setShowSettings(false);
                    alert("Ajustes guardados correctamente");
                } catch (err) { alert("Error al guardar ajustes."); }
            };

            const addProduct = async (e) => {
                e.preventDefault();
                if (!user) return;
                const productsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('products');
                try {
                    await productsRef.add({ ...newP, price: Number(newP.price), createdAt: Date.now() });
                    setShowAdd(false);
                    setNewP({ name: "", price: "", category: "Ropa", gender: "Mujer", size: "M", description: "", imageUrl: "" });
                } catch (err) { console.error("Error al subir prenda."); }
            };

            const deleteP = async (id) => {
                if (!user || !confirm("¿Eliminar esta prenda definitivamente?")) return;
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('products').doc(id).delete();
                } catch (err) { console.error("Error al eliminar."); }
            };

            const filtered = products.filter(p => 
                p.name.toLowerCase().includes(search.toLowerCase()) || 
                p.description?.toLowerCase().includes(search.toLowerCase())
            );

            return (
                <div className="min-h-screen pb-20">
                    <nav className="glass sticky top-0 z-50 p-4 border-b border-dorado/20">
                        <div className="max-w-7xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <img src={logo} className="h-12 w-12 rounded-full border-2 border-dorado object-cover" />
                                <div className="hidden sm:block">
                                    <h1 className="text-xl font-black color-azul leading-none">TREND SHOP</h1>
                                    <span className="text-[9px] font-black text-magenta uppercase tracking-widest">Online</span>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => isAdmin ? setIsAdmin(false) : setShowLogin(true)} className="p-3 rounded-full bg-slate-100 text-slate-500 hover:bg-azul hover:text-white transition-all">
                                    <i className={`fas ${isAdmin ? 'fa-unlock' : 'fa-lock'}`}></i>
                                </button>
                                
                                {isAdmin && (
                                    <>
                                        <button 
                                            onClick={() => setShowSettings(true)} 
                                            className="p-3 rounded-full bg-amber-100 text-amber-600 hover:bg-amber-600 hover:text-white transition-all shadow-sm"
                                            title="Configuración de Tienda"
                                        >
                                            <i className="fas fa-cog text-lg"></i>
                                        </button>
                                        <button 
                                            onClick={() => setShowAdd(true)} 
                                            className="bg-magenta text-white px-5 py-2 rounded-full font-black text-xs magenta-glow hover:scale-105 active:scale-95 transition-all"
                                        >
                                            + PUBLICAR
                                        </button>
                                    </>
                                )}
                            </div>
                        </div>
                    </nav>

                    <header className="py-12 px-6 text-center">
                        <h2 className="text-5xl md:text-7xl font-black color-azul leading-[0.9] tracking-tighter mb-4 uppercase">
                            ROPA QUE <br/><span className="text-transparent bg-clip-text bg-vibrant italic">PARECE NUEVA</span>
                        </h2>
                        <p className="text-slate-500 font-bold max-w-lg mx-auto">Seleccionamos lo mejor para ti. ¡Estilo increíble a precios que te harán sonreír!</p>
                    </header>

                    <main className="max-w-7xl mx-auto px-4">
                        <div className="mb-8 relative">
                            <i className="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-dorado"></i>
                            <input 
                                type="text" placeholder="¿Buscas algo especial?" 
                                className="w-full p-5 pl-12 rounded-3xl border-none shadow-inner bg-white/50 outline-none font-bold"
                                value={search} onChange={e => setSearch(e.target.value)}
                            />
                        </div>

                        {loading ? (
                            <div className="text-center py-20"><i className="fas fa-spinner fa-spin text-3xl text-dorado"></i></div>
                        ) : (
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                                {filtered.map(p => (
                                    <div key={p.id} className="product-card flex flex-col group">
                                        <div className="aspect-[3/4] relative overflow-hidden bg-slate-100">
                                            <img src={p.imageUrl} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" />
                                            <div className="absolute top-2 left-2 flex flex-col gap-1">
                                                <span className="bg-azul/80 text-white text-[8px] font-black px-2 py-1 rounded-full">{p.gender}</span>
                                                <span className="bg-dorado/80 text-white text-[8px] font-black px-2 py-1 rounded-full">Talla {p.size}</span>
                                            </div>
                                            {isAdmin && <button onClick={() => deleteP(p.id)} className="absolute top-2 right-2 bg-red-500 text-white p-2 rounded-full z-10"><i className="fas fa-trash text-xs"></i></button>}
                                        </div>
                                        <div className="p-4 flex flex-col flex-1 bg-white">
                                            <div className="flex justify-between items-center mb-1">
                                                <span className="text-[9px] font-black text-magenta uppercase">{p.category}</span>
                                                <span className="text-xl font-black color-azul">${p.price}</span>
                                            </div>
                                            <h3 className="font-bold text-sm text-slate-800 line-clamp-2 h-10 mb-4 uppercase">{p.name}</h3>
                                            <button 
                                                onClick={() => window.open(`https://wa.me/525581019848?text=¡Hola! Me interesa: ${p.name} que vi en tu tienda.`)}
                                                className="w-full py-3 bg-emerald-500 text-white rounded-2xl font-black text-[10px] shadow-lg animate-bounce-soft"
                                            >
                                                <i className="fab fa-whatsapp mr-1 text-base"></i> ME INTERESA
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {/* Login Modal */}
                    {showLogin && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-azul/80 backdrop-blur-md">
                            <div className="bg-white p-8 rounded-[2rem] max-w-xs w-full shadow-2xl">
                                <h3 className="text-center font-black mb-6 uppercase text-slate-400 text-xs tracking-widest">Acceso Administrador</h3>
                                <form onSubmit={handleLogin}>
                                    <input type="password" placeholder="••••" autoFocus className="w-full p-4 bg-slate-100 rounded-2xl mb-4 text-center text-2xl tracking-widest outline-none border-2 border-transparent focus:border-magenta" value={pass} onChange={e => setPass(e.target.value)} />
                                    <button className="w-full py-4 bg-magenta text-white rounded-2xl font-black shadow-lg">ENTRAR</button>
                                </form>
                                <button onClick={() => setShowLogin(false)} className="w-full text-slate-400 text-[10px] font-black uppercase mt-4">Cancelar</button>
                            </div>
                        </div>
                    )}

                    {/* Settings Modal (EL ENGRANE) */}
                    {showSettings && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-azul/80 backdrop-blur-md">
                            <div className="bg-white p-8 rounded-[3rem] max-w-md w-full shadow-2xl border-t-8 border-amber-500">
                                <h3 className="font-black mb-6 uppercase text-azul text-lg tracking-tighter">Configuración de Tienda</h3>
                                <div className="space-y-5">
                                    <div>
                                        <label className="text-[10px] font-black uppercase color-azul ml-2 opacity-50">Link del Logo</label>
                                        <input type="text" className="w-full p-4 bg-slate-100 rounded-2xl text-xs outline-none focus:ring-2 focus:ring-amber-500" value={logo} onChange={e => setLogo(e.target.value)} />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-black uppercase color-azul ml-2 opacity-50">Clave API ImgBB (Subida de fotos)</label>
                                        <p className="text-[8px] text-slate-400 ml-2 mb-1">Obtenla gratis en api.imgbb.com</p>
                                        <input type="text" placeholder="Pega tu clave aquí" className="w-full p-4 bg-slate-100 rounded-2xl text-xs outline-none focus:ring-2 focus:ring-amber-500" value={imgbbKey} onChange={e => setImgbbKey(e.target.value)} />
                                    </div>
                                    <button onClick={saveSettings} className="w-full py-4 bg-azul text-white rounded-2xl font-black shadow-xl">GUARDAR AJUSTES</button>
                                    <button onClick={() => setShowSettings(false)} className="w-full py-2 text-slate-400 text-[10px] font-black uppercase mt-2">Cerrar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showAdd && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-azul/80 backdrop-blur-md overflow-y-auto">
                            <div className="bg-white rounded-[3rem] w-full max-w-lg p-8 my-10">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-2xl font-black color-azul uppercase">NUEVA PRENDA</h3>
                                    <button onClick={() => setShowAdd(false)} className="text-slate-300 hover:text-red-500"><i className="fas fa-times text-xl"></i></button>
                                </div>
                                <form onSubmit={addProduct} className="space-y-4">
                                    <input required placeholder="Nombre de la prenda" className="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-magenta" value={newP.name} onChange={e => setNewP({...newP, name: e.target.value})} />
                                    <div className="flex gap-4">
                                        <input required type="number" placeholder="Precio ($)" className="flex-1 p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-magenta font-bold" value={newP.price} onChange={e => setNewP({...newP, price: e.target.value})} />
                                        <select className="flex-1 p-4 bg-slate-50 rounded-2xl outline-none" value={newP.size} onChange={e => setNewP({...newP, size: e.target.value})}>
                                            {SIZES.map(s => <option key={s} value={s}>{s}</option>)}
                                        </select>
                                    </div>
                                    
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-black uppercase color-azul ml-4 flex justify-between">
                                            Foto de la prenda
                                            {uploading && <span className="text-magenta animate-pulse">Subiendo...</span>}
                                        </label>
                                        <div className="flex gap-2">
                                            <input required placeholder="Link de imagen" className="flex-1 p-4 bg-slate-50 rounded-2xl text-xs outline-none" value={newP.imageUrl} onChange={e => setNewP({...newP, imageUrl: e.target.value})} />
                                            <label className="cursor-pointer bg-magenta text-white p-4 rounded-2xl hover:bg-magenta/80 transition-all shadow-md">
                                                <i className={`fas ${uploading ? 'fa-spinner fa-spin' : 'fa-camera'}`}></i>
                                                <input type="file" className="hidden" accept="image/*" onChange={handleFileUpload} disabled={uploading} />
                                            </label>
                                        </div>
                                    </div>

                                    <textarea placeholder="Descripción del estado (ej. Como nueva, marca original...)" className="w-full p-4 bg-slate-50 rounded-2xl h-24 outline-none focus:ring-2 focus:ring-magenta" value={newP.description} onChange={e => setNewP({...newP, description: e.target.value})}></textarea>
                                    <button className="w-full py-5 bg-magenta text-white rounded-3xl font-black shadow-xl" disabled={uploading}>
                                        {uploading ? "SUBIENDO FOTO..." : "PUBLICAR AHORA"}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
